name: Build
on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: write
  packages: write
  pull-requests: read
jobs:
  commitlint:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # fetch-depth is required

      - uses: wagoid/commitlint-github-action@v6

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Required for pre-commit to be able scan history

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-python@v7
        with:
          python-version: 3.x

      - name: Install dependencies
        run: go install ./...

      - name: go-vet
        run: go vet -v ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9

      - uses: pre-commit/action@v3.0.1

      - name: Running Tests
        run: |
          make test

  test-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Create k8s Kind Cluster
        uses: helm/kind-action@v1

      - name: Verify kind installation
        run: kind version

      - name: Running Test e2e
        run: |
          make test-e2e

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Install helm-unittest
        run: helm plugin install --verify=false https://github.com/helm-unittest/helm-unittest

      # Fails if the chart's crds/ have drifted from the controller-gen output
      - name: Check chart CRDs are in sync
        run: make helm-check

      - name: helm lint
        run: make helm-lint

      - name: helm unittest
        run: make helm-unittest

      - name: helm template
        run: make helm-template

      - name: helm package
        run: |
          make helm-package
          ls -l dist/charts
          test -n "$(find dist/charts -name '*.tgz' -print -quit)"

      - uses: actions/upload-artifact@v4
        with:
          name: helm-chart
          path: dist/charts/*.tgz
          if-no-files-found: error

      - name: Create k8s Kind Cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: helm-smoke

      - name: Helm chart smoke test
        run: make helm-smoke KIND_CLUSTER=helm-smoke

  build:
    runs-on: ubuntu-latest
    needs:
      - commitlint
      - test
      - test-e2e
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image metadata
        id: image
        shell: bash
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
            PUSH=true
            PLATFORMS="linux/amd64,linux/arm64"
          elif [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            TAG="${GITHUB_SHA}"
            PUSH=true
            PLATFORMS="linux/amd64"
          else
            TAG="${GITHUB_SHA}"
            PUSH=false
            PLATFORMS="linux/amd64"
          fi

          echo "tag=${IMAGE}:${TAG}" >> "$GITHUB_OUTPUT"
          echo "push=${PUSH}" >> "$GITHUB_OUTPUT"
          echo "platforms=${PLATFORMS}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ steps.image.outputs.platforms }}
          push: ${{ steps.image.outputs.push }}
          tags: ${{ steps.image.outputs.tag }}

  helm_publish:
    runs-on: ubuntu-latest
    needs:
      - build
      - helm
    # Charts are published from Git tags only. Pushes to main validate the
    # chart but deliberately publish nothing.
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up Helm
        uses: azure/setup-helm@v4

      # A tag of v0.1.0 gives a chart version of 0.1.0 and an appVersion of
      # v0.1.0, so the chart's default image is the image this tag published.
      - name: Set chart metadata
        id: chart
        shell: bash
        run: |
          APP_VERSION="${GITHUB_REF_NAME}"
          CHART_VERSION="${APP_VERSION#v}"

          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "chart_version=${CHART_VERSION}" >> "$GITHUB_OUTPUT"
          echo "registry=oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts" >> "$GITHUB_OUTPUT"

      - name: Package the chart
        run: |
          make helm-package HELM_PACKAGE_ARGS="\
            --version ${{ steps.chart.outputs.chart_version }} \
            --app-version ${{ steps.chart.outputs.app_version }}"

      - name: Log in to GitHub Container Registry
        run: |
          helm registry login ghcr.io \
            --username "${{ github.actor }}" \
            --password "${{ secrets.GITHUB_TOKEN }}"

      # Pushing temporal-resource-operator-<version>.tgz to
      # oci://ghcr.io/<owner>/charts publishes
      # ghcr.io/<owner>/charts/temporal-resource-operator:<version> - helm adds
      # the chart name, so it must not be in the destination.
      - name: Publish the chart
        run: |
          helm push \
            "dist/charts/temporal-resource-operator-${{ steps.chart.outputs.chart_version }}.tgz" \
            "${{ steps.chart.outputs.registry }}"
