                            maxLength: 20
                            pattern: ^[+-]?(0|(\d{1,4}d)?((\d{1,6}(\.\d{0,9})?|\.\d{1,9})(ns|us|µs|μs|ms|s|m|h))+|\d{1,4}d)$
                            type: string
                        type: object
                      type:
                        description: type is the workflow type to start, as registered
