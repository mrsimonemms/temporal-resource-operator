                            pattern: ^[+-]?(0|(\d{1,4}d)?((\d{1,6}(\.\d{0,9})?|\.\d{1,9})(ns|us|µs|μs|ms|s|m|h))+|\d{1,4}d)$
                            type: string
                          task:
                            description: |-
                              task is how long a worker has to process one workflow task once it has
