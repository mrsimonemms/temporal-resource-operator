                        minLength: 1
                        type: string
                      timeouts:
                        description: timeouts bound each run. Omitted fields take
                          the namespace's defaults.
                        properties:
                          execution:
                            description: |-
                              execution is how long the whole workflow execution may take, retries and
                              continue-as-new included.
                            maxLength: 20
                            pattern: ^[+-]?(0|(\d{1,4}d)?((\d{1,6}(\.\d{0,9})?|\.\d{1,9})(ns|us|µs|μs|ms|s|m|h))+|\d{1,4}d)$
                            type: string
                          run:
                            description: run is how long a single run of the workflow
