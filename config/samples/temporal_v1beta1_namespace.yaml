# This is created by the operator - if this is deleted, it
# deletes the namespace from Temporal
apiVersion: temporal.simonemms.com/v1beta1
kind: Namespace
metadata:
  labels:
    app.kubernetes.io/name: temporal-resource-operator
    app.kubernetes.io/managed-by: kustomize
  # The resource name is the Temporal namespace name
  name: namespace-sample
spec:
  connectionRef:
    name: connection-sample
  # Go's duration units, plus a leading number of days where 1d is exactly 24h.
  # "3d" and "72h" are the same duration. Must be between 1d and 90d inclusive,
  # whichever notation is used.
  retention: 3d
  # Delete is the default. Set it to Orphan to leave the Temporal namespace
  # behind when this resource is deleted - which is also how a deletion blocked
  # on a missing Connection is released.
  deletionPolicy: Delete
---
# This is exists before the operator - if this is deleted, it
# is NOT deleted from Temporal. However, it will still update
# the settings of the namespace
apiVersion: temporal.simonemms.com/v1beta1
kind: Namespace
metadata:
  labels:
    app.kubernetes.io/name: temporal-resource-operator
    app.kubernetes.io/managed-by: kustomize
  # The resource name is the Temporal namespace name
  name: default
spec:
  connectionRef:
    name: connection-sample
  retention: 1d
  deletionPolicy: Orphan
