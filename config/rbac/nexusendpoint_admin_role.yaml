# This rule is not used by the project app itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over temporal.simonemms.com.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: temporal-resource-operator
    app.kubernetes.io/managed-by: kustomize
  name: nexusendpoint-admin-role
rules:
- apiGroups:
  - temporal.simonemms.com
  resources:
  - nexusendpoints
  verbs:
  - '*'
- apiGroups:
  - temporal.simonemms.com
  resources:
  - nexusendpoints/status
  verbs:
  - get
