suite: rbac and service account
release:
  name: temporal-resource-operator
  namespace: temporal-resource-operator-system
tests:
  - it: creates a ServiceAccount by default
    templates:
      - serviceaccount.yaml
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: temporal-resource-operator
      - equal:
          path: metadata.namespace
          value: temporal-resource-operator-system

  - it: creates no ServiceAccount when asked not to
    templates:
      - serviceaccount.yaml
    set:
      serviceAccount:
        create: false
        name: existing-sa
    asserts:
      - hasDocuments:
          count: 0

  - it: annotates the ServiceAccount
    templates:
      - serviceaccount.yaml
    set:
      serviceAccount:
        annotations:
          eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/tro
    asserts:
      - equal:
          path: metadata.annotations["eks.amazonaws.com/role-arn"]
          value: arn:aws:iam::123456789012:role/tro

  - it: grants the operator exactly the permissions it needs
    templates:
      - rbac-manager.yaml
    documentIndex: 0
    asserts:
      - isKind:
          of: ClusterRole
      - equal:
          path: metadata.name
          value: temporal-resource-operator-manager
      - contains:
          path: rules
          content:
            apiGroups:
              - ""
            resources:
              - secrets
            verbs:
              - get
      - contains:
          path: rules
          content:
            apiGroups:
              - temporal.simonemms.com
            resources:
              - namespaces/finalizers
              - nexusendpoints/finalizers
              - searchattributes/finalizers
            verbs:
              - update
      - contains:
          path: rules
          content:
            apiGroups:
              - temporal.simonemms.com
            resources:
              - connections/status
              - namespaces/status
              - nexusendpoints/status
              - searchattributes/status
            verbs:
              - get
              - patch
              - update

  - it: binds the manager ClusterRole to the chart ServiceAccount in the release namespace
    templates:
      - rbac-manager.yaml
    documentIndex: 1
    release:
      name: temporal-resource-operator
      namespace: somewhere-else
    asserts:
      - isKind:
          of: ClusterRoleBinding
      - equal:
          path: roleRef.name
          value: temporal-resource-operator-manager
      - equal:
          path: subjects[0].name
          value: temporal-resource-operator
      - equal:
          path: subjects[0].namespace
          value: somewhere-else

  - it: binds to a pre-existing ServiceAccount when the chart creates none
    templates:
      - rbac-manager.yaml
    documentIndex: 1
    set:
      serviceAccount:
        create: false
        name: existing-sa
    asserts:
      - equal:
          path: subjects[0].name
          value: existing-sa

  - it: scopes leader election to the release namespace
    templates:
      - rbac-leader-election.yaml
    release:
      name: temporal-resource-operator
      namespace: somewhere-else
    asserts:
      - equal:
          path: metadata.namespace
          value: somewhere-else
      - equal:
          path: metadata.name
          value: temporal-resource-operator-leader-election

  - it: allows lease and event access for leader election
    templates:
      - rbac-leader-election.yaml
    documentIndex: 0
    asserts:
      - isKind:
          of: Role
      - contains:
          path: rules
          content:
            apiGroups:
              - coordination.k8s.io
            resources:
              - leases
            verbs:
              - get
              - list
              - watch
              - create
              - update
              - patch
              - delete
      - contains:
          path: rules
          content:
            apiGroups:
              - ""
            resources:
              - events
            verbs:
              - create
              - patch

  - it: creates the metrics authn/authz roles when metrics are on
    templates:
      - rbac-metrics.yaml
    asserts:
      - hasDocuments:
          count: 3

  - it: creates no metrics roles when metrics are off
    templates:
      - rbac-metrics.yaml
    set:
      metrics:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: makes cluster-scoped names release-aware
    templates:
      - rbac-manager.yaml
      - rbac-metrics.yaml
    release:
      name: tro
      namespace: temporal-resource-operator-system
    asserts:
      - matchRegex:
          path: metadata.name
          pattern: ^tro-temporal-resource-operator-
